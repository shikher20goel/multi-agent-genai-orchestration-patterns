agentforce:
  # --- Pricing decomposition (task 105) ------------------------------------
  # Salesforce Agentforce billing has two public reference points:
  #   (a) "$2 per conversation" list pricing (Salesforce press release,
  #       2024-09, https://www.salesforce.com/news/) — conversation-level.
  #   (b) "Flex Credits" consumption pricing, announced 2025-05
  #       (Salesforce Agentforce Flex pricing announcement;
  #       https://www.salesforce.com/agentforce/pricing/): list price
  #       USD 0.10 per ACTION an agent executes, where Flow/Apex/prompt
  #       actions each consume credits. [HUMAN: verify both sources +
  #       current per-action list price]
  # DECOMPOSITION DECISION (documented here per task 105): the rig bills
  # Agentforce at the ACTION level under the Flex-Credit model (b),
  # because the rig's unit of work is the individual platform call. A
  # model-backed reasoning step (topic dispatch / generative response)
  # is modeled as the per-invocation share of the $2 conversation list
  # price under an assumed 4 reasoning steps per conversation
  # ($2.00 / 4 = $0.50 per invocation). EVERY executed action — including
  # Agent Script actions that run WITHOUT a model call — consumes one
  # Flex action credit ($0.10): Agent Script paths are conversation/credit
  # billed and can never produce a zero-billed request. [HUMAN: verify the
  # decomposition; alternatives are pure per-conversation or pure
  # per-credit billing.]
  price_per_conversation: 2.00     # USD list price, Salesforce announcement 2024-09 [HUMAN: verify]
  assumed_invocations_per_conversation: 4   # modeling assumption [HUMAN: verify]
  # Derived per-invocation flat price (price_per_conversation / assumed invocations).
  # Agentforce does not bill by token publicly; token prices set to 0 and the
  # flat per-invocation charge carries the model-step cost. [HUMAN: verify]
  price_per_1k_tokens_in: 0.0      # USD; not token-billed publicly [HUMAN: verify]
  price_per_1k_tokens_out: 0.0     # USD; not token-billed publicly [HUMAN: verify]
  price_per_invocation_flat: 0.50  # USD = 2.00 / 4, as of 2024-09 list price [HUMAN: verify]
  service_calls:
    # Flex-Credit action billing (task 105): one credit per executed action,
    # USD 0.10 list, as of the 2025-05 Flex pricing announcement. This is
    # what an Agent Script step consumes even when it makes no LLM call —
    # the path is never zero-billed. [HUMAN: verify current credit price]
    action: 0.10             # USD / invoked action (Flow/Apex/prompt), Flex Credit list price, as of 2025-05 [HUMAN: verify]
    # Remaining Salesforce platform operations are bundled in org licensing;
    # marginal per-call prices are PLACEHOLDERS for relative comparison only,
    # modeled on platform-event/API allowances. [HUMAN: verify all four]
    event_bus: 0.0000010     # USD / platform event publish      PLACEHOLDER [HUMAN: verify]
    memory: 0.0000005        # USD / session-context store op    PLACEHOLDER [HUMAN: verify]
    omni_channel: 0.0000020  # USD / Omni-Channel routing op     PLACEHOLDER [HUMAN: verify]
    guardrails: 0.0000010    # USD / trust-layer scan            PLACEHOLDER [HUMAN: verify]
