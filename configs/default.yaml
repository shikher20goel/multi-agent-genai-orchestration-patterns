# Master configuration for the agentorch measurement rig.
# All tunables live here; no magic numbers in code.

seed: 42

latency:
  # Lognormal service-time parameters per platform/service, in seconds.
  # mu/sigma are parameters of the underlying normal (log-space).
  #
  # CALIBRATION (Phase 2, task 101): a single LLM model step has p50 in the
  # 0.8-2.5 s range (realistic hosted-LLM agent step). Cross-platform deltas
  # are SMALL and DOCUMENTED: Agentforce model steps carry the Atlas
  # reasoning-engine runtime overhead (~+15% median vs Bedrock); Bedrock tool
  # calls pay one AgentCore gateway hop (the `gateway` service below) that
  # Agentforce in-platform actions do not. No other cross-platform gaps exist.
  bedrock:
    model_invoke: {mu: 0.10, sigma: 0.45}     # p50 ~1.11 s LLM agent step
    gateway: {mu: -3.0, sigma: 0.35}          # ~50 ms AgentCore gateway hop
    tool: {mu: -2.3, sigma: 0.45}             # ~100 ms tool execution
    memory: {mu: -4.0, sigma: 0.30}           # ~18 ms memory store op
    event_bus: {mu: -3.7, sigma: 0.30}        # ~25 ms event publish
    identity: {mu: -4.3, sigma: 0.25}         # ~14 ms identity check
    observability: {mu: -5.0, sigma: 0.25}    # ~7 ms telemetry emit
    guardrails: {mu: -3.5, sigma: 0.30}       # ~30 ms guardrail scan
  agentforce:
    model_invoke: {mu: 0.24, sigma: 0.45}     # p50 ~1.27 s (Atlas runtime overhead, ~+15%)
    action: {mu: -2.0, sigma: 0.45}           # ~135 ms Apex/flow action
    event_bus: {mu: -3.2, sigma: 0.35}        # ~40 ms platform event
    memory: {mu: -3.6, sigma: 0.30}           # ~27 ms session/context store
    omni_channel: {mu: -2.5, sigma: 0.40}     # ~82 ms Omni-Channel routing
    guardrails: {mu: -3.4, sigma: 0.30}       # ~33 ms trust-layer scan
  shared:
    # Platform-independent delay terms (task 101).
    # Human review decision time: lognormal, p50 ~30 s, mean ~33 s,
    # p99 ~85 s — HITL end-to-end latency is human-step-dominated.
    human_decision_delay: {mu: 3.40, sigma: 0.45}
    # Cross-platform round trip paid by the P7 bridge per federated call
    # (~120 ms median: WAN RTT + identity translation at the bridge).
    cross_platform_rtt: {mu: -2.12, sigma: 0.30}

faults:
  timeout_s: 30.0          # request deemed timed out beyond this service time
  throttle_delay_s: 2.0    # extra delay injected by a THROTTLE fault
  containment_threshold: 0.95  # success-rate floor for a non-propagated cell
  campaign:
    # Algorithm 2 sweep (task 104): for each pattern, only the components on
    # that pattern's structural path are exercised (NOT_EXERCISED is reserved
    # for structurally irrelevant component x pattern pairs). OUTAGE faults
    # use a cross-request outage WINDOW: the component is down for
    # `outage_window_fraction` of the run, centred mid-run, and every request
    # traversing it during the window is affected. TIMEOUT/ERROR/THROTTLE
    # remain per-call probabilistic faults.
    components: [model_backend, gateway, tool, event_bus, memory_store, human_queue]
    fault_types: [timeout, error, throttle, outage]
    probability: 0.5       # per-boundary-call fault firing probability when armed
    outage_window_fraction: 0.4   # fraction of the run the component is down
    n_requests: 40         # requests per campaign cell (full study)
    smoke_n_requests: 8    # requests per cell under --smoke
    # Rare-path components (the human queue is only traversed by the
    # below-threshold fraction of requests) get a larger window so the
    # cell is actually exercised.
    rare_path_boost: 4
    rare_path_components: [human_queue]

tokens:
  # Synthetic token-count model per scenario step (mean values; rig draws Poisson).
  input_mean: 600
  output_mean: 250

scenarios:
  s1:
    retrieval_passages: 3
    hitl_review_fraction: 0.2   # fraction of items below the P6 confidence gate
  s2:
    min_steps: 4
    max_steps: 8
    hitl_review_fraction: 0.2
  s3:
    burst_factor: 5.0
    burst_fraction: 0.2     # fraction of the arrival window that is bursty
    burst_cycle_s: 60.0     # incident-storm cycle length (burst at cycle start)
    human_routing_fraction: 0.15

patterns:
  p1:
    n_collaborators: 3
  p4:
    n_specialists: 3
    # Write-contention term (task 101): each blackboard write pays this much
    # extra latency per concurrent writer beyond itself (store-mediated
    # coordination is contention-bound).
    contention_per_writer_s: 0.1
  p3:
    # Decoupled consumption (task 101): choreography consumers are
    # independent bus subscribers that scale with queue depth, so the
    # effective service pool is consumer_scale x the provisioned base
    # concurrency. This is the structural mechanism by which the bus
    # absorbs bursts instead of a coordinator serializing them.
    consumer_scale: 4
  p5:
    tools: [search, calculator, crm_lookup]
  p6:
    confidence_threshold: 0.7
  p7:
    clusters: 2

stats:
  n_resamples: 2000
  alpha: 0.05

load:
  # Task 102: before each condition the rig probes single-replica service
  # time, estimates the saturation rate (concurrency / mean service time),
  # and offers utilization_target x that rate. p99 is therefore never an
  # unbounded-queue artifact; per-condition saturation and the chosen rate
  # are recorded in results/manifest.json.
  utilization_target: 0.7
  saturation_probe_n: 40

study:
  rate_rps: 2.0   # transitional: superseded by load.utilization_target (task 102)
  concurrency: 4
  n_items: 500
  smoke_n_items: 20
