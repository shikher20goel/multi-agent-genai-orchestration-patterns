[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentorch"
version = "0.1.0"
description = "Reproducibility package: pattern catalog for multi-agent generative AI orchestration (mocked platforms, deterministic rig)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "statsmodels",
    "pandas",
    "matplotlib",
    "simpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
